[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]

[tool.pyright]
extraPaths = ["backend", "backend/tests"]
include = ["backend", "scripts"]

[tool.mypy]
mypy_path = "backend:backend/tests"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "real_provider: requires live provider credentials and is opt-in",
]
