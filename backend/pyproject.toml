[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kuralcredit-backend"
version = "0.1.0"
description = "KuralCredit FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.9,<3.0",
  "pypdf>=5.0",
  "openpyxl>=3.1,<4.0",
  "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "reportlab>=4.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "config/*.json"]
