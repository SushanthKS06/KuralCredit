name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint, Typecheck and Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      GNANI_API_KEY: test-ci-gnani-key
      GROQ_API_KEY: test-ci-groq-key
      SECRET_KEY: test-ci-secret-key-that-is-long-enough-for-hs256
      REVIEWER_DEMO_EMAIL: reviewer@kuralcredit.demo
      REVIEWER_DEMO_PASSWORD: test-reviewer-password
      RATE_LIMIT_PER_MINUTE: "600"
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest anyio httpx
          pip install "fastapi>=0.115.0" "uvicorn[standard]>=0.30.0" "pydantic>=2.7.0" "pydantic-settings>=2.2.0" "sqlalchemy>=2.0.30" "alembic>=1.13.0" "python-jose[cryptography]>=3.3.0" "PyJWT>=2.8.0" "python-multipart>=0.0.9" "pypdf>=4.2.0" "openpyxl>=3.1.2" "groq>=0.9.0"

      - name: Secret and Release-Hygiene Scan
        run: python scripts/check_secrets.py

      - name: Ruff Lint Check
        run: ruff check backend scripts

      - name: Run Backend Pytest
        run: python -m pytest backend/tests

      - name: Run Deterministic Evaluation Benchmark
        run: python scripts/run_evaluation.py

      - name: Verify Backend Submission Readiness
        run: python scripts/verify_submission.py --skip-frontend

  frontend:
    name: Frontend Typecheck, Lint, Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test -- --run

      - name: Build Production Bundle
        run: npm run build

